name: Sync Upstream & Release Kodi Addon

on:
  schedule:
    - cron: '18 4 * * *' # 每天 UTC 04:18 (北京时间 12:18) 避开整点高峰自动检查并同步运行
  workflow_dispatch: # 支持在 GitHub Web 界面手动一键触发

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Ponphil/LitePan.git || true
          git fetch upstream main
          
          # 尝试合并上游 main 分支
          if ! git merge upstream/main --no-edit; then
            echo "Merge encountered conflicts, aborting merge to preserve local files..."
            git merge --abort || true
          fi
          
          # 推送更新后的代码至本 Fork 仓库
          git push origin main || echo "No changes to push or push skipped."

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install & Build Web Frontend
        run: |
          if [ -d "web" ]; then
            cd web
            npm ci || npm install
            echo "Building Web frontend once for all architecture targets..."
            npm run build
          fi

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl

      - name: Run Kodi Addon Build Script
        run: |
          chmod +x ./build_kodi_addon.sh
          echo "Building Universal package..."
          SKIP_BUILD_WEB=1 ./build_kodi_addon.sh universal
          echo "Building ARMv7 package..."
          SKIP_BUILD_WEB=1 ./build_kodi_addon.sh armv7
          echo "Building ARM64 package..."
          SKIP_BUILD_WEB=1 ./build_kodi_addon.sh arm64

      - name: Determine Version and Locate Assets
        id: get_info
        run: |
          VERSION="v0.4.4-Beta"
          if [ -f "internal/httpx/user_agent.go" ]; then
            EXTRACTED_VER=$(grep 'AppVersion =' internal/httpx/user_agent.go | cut -d '"' -f 2)
            if [ -n "${EXTRACTED_VER}" ]; then
              VERSION="${EXTRACTED_VER}"
            fi
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          echo "Generated ZIP packages:"
          ls -l dist/service.litepan-*.zip

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_info.outputs.VERSION }}"
          
          echo "Releasing version ${VERSION} with all zip assets to repository ${{ github.repository }}..."
          
          if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists in ${{ github.repository }}, uploading assets..."
            gh release upload "${VERSION}" dist/service.litepan-*.zip --clobber --repo "${{ github.repository }}"
          else
            echo "Release ${VERSION} does not exist in ${{ github.repository }}, creating release..."
            gh release create "${VERSION}" dist/service.litepan-*.zip \
              --repo "${{ github.repository }}" \
              --title "LitePan Kodi Addon ${VERSION}" \
              --notes "Auto-built Kodi Addon release synchronized from upstream Ponphil/LitePan."
          fi
