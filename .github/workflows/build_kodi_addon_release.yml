name: Sync Upstream & Release Kodi Addon

on:
  schedule:
    - cron: '18 * * * *' # 每 1 小时自动检查一次上游更新（避开整点排队高峰）
  workflow_dispatch: # 支持在 GitHub Web 界面手动一键触发

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream & Check Updates
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Ponphil/LitePan.git || true
          git fetch upstream main

          NEW_COMMITS_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New commits count from upstream: ${NEW_COMMITS_COUNT}"

          # 判断上游代码变动（如果是定时触发且新 Commit 数量为 0 则跳过打包）
          if [ "${NEW_COMMITS_COUNT}" -eq 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No new commits from upstream. Skipping build and release."
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "New updates detected (${NEW_COMMITS_COUNT} commits, or manually triggered). Merging upstream code..."
            if ! git merge upstream/main --no-edit; then
              echo "Merge encountered conflicts, aborting merge to preserve local files..."
              git merge --abort || true
            fi
            git push origin main || echo "No changes to push or push skipped."
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go Environment
        if: steps.sync.outputs.has_update == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Build Tools
        if: steps.sync.outputs.has_update == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zip curl

      - name: Run Kodi Addon Build Script (ARM64)
        if: steps.sync.outputs.has_update == 'true'
        run: |
          chmod +x ./build_kodi_addon.sh
          echo "Building ARM64 package..."
          SKIP_BUILD_WEB=1 ./build_kodi_addon.sh arm64

      - name: Determine Version and Locate Assets
        if: steps.sync.outputs.has_update == 'true'
        id: get_info
        run: |
          VERSION="v0.5.2-Beta"
          if [ -f "internal/buildinfo/version.go" ]; then
            EXTRACTED_VER=$(grep 'Version =' internal/buildinfo/version.go | cut -d '"' -f 2)
          elif [ -f "internal/httpx/user_agent.go" ]; then
            EXTRACTED_VER=$(grep 'AppVersion =' internal/httpx/user_agent.go | cut -d '"' -f 2)
          fi
          if [ -n "${EXTRACTED_VER}" ]; then
            VERSION="${EXTRACTED_VER}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          echo "Generated ARM64 ZIP package:"
          ls -l dist/service.litepan-*-arm64.zip

      - name: Create or Update GitHub Release
        if: steps.sync.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_info.outputs.VERSION }}"
          
          echo "Releasing version ${VERSION} with ARM64 zip asset to repository ${{ github.repository }}..."
          
          if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists in ${{ github.repository }}, uploading asset..."
            gh release upload "${VERSION}" dist/service.litepan-*-arm64.zip --clobber --repo "${{ github.repository }}"
          else
            echo "Release ${VERSION} does not exist in ${{ github.repository }}, creating release..."
            gh release create "${VERSION}" dist/service.litepan-*-arm64.zip \
              --repo "${{ github.repository }}" \
              --title "LitePan Kodi Addon ${VERSION}" \
              --notes "Auto-built Kodi Addon release synchronized from upstream Ponphil/LitePan."
          fi

      - name: Deploy Addon to Kodi Repository Server
        if: steps.sync.outputs.has_update == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/var/www/kodi' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          VERSION: ${{ steps.get_info.outputs.VERSION }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${SERVER_HOST}" ]; then
            echo "::warning::未配置 SERVER_SSH_KEY 或 SERVER_HOST Secret，跳过自动同步部署到 Kodi 插件库服务器。"
            exit 0
          fi

          echo "=========================================="
          echo "开始同步 LitePan 插件至 Kodi 插件库服务器"
          echo "目标部署根目录: ${SERVER_PATH}"
          echo "=========================================="

          # 1. 提取符合 Kodi 规范的纯点分版本号 (例如 0.5.2)
          KODI_VER=$(echo "${VERSION}" | sed 's/^v//' | sed 's/-.*//')
          
          # 2. 组装插件库规范的 staging 目录
          STAGING_DIR="dist/repo_staging/zips/service.litepan"
          mkdir -p "${STAGING_DIR}"
          
          ZIP_SRC=$(ls dist/service.litepan-*-arm64.zip | head -n 1)
          if [ ! -f "${ZIP_SRC}" ]; then
            echo "错误: 未找到构建好的 ZIP 产物！"
            exit 1
          fi
          
          # 复制标准命名的 zip 包
          cp "${ZIP_SRC}" "${STAGING_DIR}/service.litepan-${KODI_VER}.zip"
          
          # 从 ZIP 中提取 addon.xml 与 icon.png
          unzip -p "${ZIP_SRC}" "service.litepan/addon.xml" > "${STAGING_DIR}/addon.xml"
          unzip -p "${ZIP_SRC}" "service.litepan/icon.png" > "${STAGING_DIR}/icon.png"
          
          # 3. 配置 SSH 密钥与环境
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. 同步插件文件到远程插件库目录
          echo "正在同步插件包至 ${SERVER_HOST}:${SERVER_PATH}/zips/service.litepan/ ..."
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${SERVER_PATH}/zips/service.litepan"
          rsync -avz -e "ssh -p ${SERVER_PORT} -o StrictHostKeyChecking=no" dist/repo_staging/zips/service.litepan/ "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/zips/service.litepan/"
          
          # 5. 上传并执行 build_repo.py 更新全局 addons.xml 和 md5 索引
          echo "正在更新远程插件库索引 addons.xml 与 md5..."
          rsync -avz -e "ssh -p ${SERVER_PORT} -o StrictHostKeyChecking=no" scripts/build_repo.py "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/build_repo.py"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" "chmod -R a+rX ${SERVER_PATH}/zips && python3 ${SERVER_PATH}/build_repo.py ${SERVER_PATH}"

          echo "=========================================="
          echo "插件已成功发布至 Kodi 插件库！"
          echo "插件库地址: https://kodi.jukuku.xyz/zips/addons.xml"
          echo "=========================================="
